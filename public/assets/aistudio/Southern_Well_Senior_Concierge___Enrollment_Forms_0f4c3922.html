.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}
.card h3{margin:0;background:var(--olive);color:#fff;font-size:13px;letter-spacing:.8px;text-transform:uppercase;padding:8px 12px}
.body{padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label.l,.lab{display:block;font-size:12px;font-weight:bold;color:var(--head);margin:6px 0 3px}
input[type=text],input[type=date],input[type=datetime-local],textarea{width:100%;font:inherit;padding:7px;border:0;border-bottom:1.5px solid var(--sage);background:transparent;color:var(--ink);border-radius:0}
textarea{border:1.5px solid var(--sage);min-height:70px;border-radius:6px}
input:focus,textarea:focus{outline:2px solid var(--grass)}
.opts{display:flex;flex-wrap:wrap;gap:4px 16px}.opts.col{flex-direction:column}
.opt{display:flex;gap:7px;align-items:flex-start;cursor:pointer;padding:2px 0}.opt input{margin-top:4px;accent-color:var(--olive);width:16px;height:16px;flex:none}
.note{font-size:13px;font-style:italic;margin:6px 0}

.scope{border-top:1px dashed var(--line);padding:8px 0;display:flex;gap:10px;align-items:center}.scope p{margin:0;flex:1}.scope input{width:70px;text-align:center}
canvas{width:100%;max-width:480px;height:120px;border:1.5px solid var(--sage);border-radius:6px;background:#fff;touch-action:none;display:block}
.sigbar{display:flex;gap:8px;margin-top:4px}
.btn{font:inherit;font-size:14px;border:1px solid var(--olive);background:var(--olive);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer}.btn.alt{background:transparent;color:var(--olive)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin:16px 0}
.fixed{padding:7px 0;border-bottom:1.5px solid var(--sage)}
footer{text-align:center;font-size:12px;color:var(--sage);padding:14px}
@media print{header p,nav,.ctl,.sigbar,footer{display:none}body{background:#fff;color:#000;font-size:12px}
.stage{display:block!important;page-break-after:always}body[data-only] .stage:not(.only){display:none!important}
.card{break-inside:avoid;border-color:#999}.card h3,th{background:#16263B!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
header{background:#fff;color:#000;border-bottom:2px solid #16263B;padding:6px}main{padding:0}canvas{border-color:#999}}
